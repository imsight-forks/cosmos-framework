# Two-clip mechanics qualification; this is not the bounded style-learning run.
[job]
task = "vfm"
experiment = "segmentation_sft_nano"
experiment_module = "cosmos_framework.configs.base.experiment.sft.vision_sft_nano"
project = "cosmos3"
group = "paired-segmentation-lora"
name = "qualification"
wandb_mode = "disabled"

[model]
precision = "bfloat16"
lora_enabled = true
lora_rank = 16
lora_alpha = 32
lora_target_modules = "q_proj_moe_gen,k_proj_moe_gen,v_proj_moe_gen,o_proj_moe_gen"

[model.parallelism]
data_parallel_shard_degree = -1
data_parallel_replicate_degree = 1

[model.compile]
enabled = false

[model.ema]
enabled = false

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 1e-4
betas = [0.9, 0.95]
eps = 1e-6
fused = true
weight_decay = 0.0
keys_to_select = ["lora_"]

[scheduler]
cycle_lengths = [20]
warm_up_steps = [10]
f_start = [0.0]
f_max = [1.0]
f_min = [0.0]

[trainer]
distributed_parallelism = "fsdp"
grad_accum_iter = 1
max_iter = 20
logging_iter = 1

[checkpoint]
# Use the public serial CPU loader for this synchronous local checkpoint recipe.
dcp_per_thread_copy_ahead = 0
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
keys_to_skip_loading = ["net_ema.", "lora_"]
save_iter = 10
